{% extends "base.html" %}

{% block content %}
  <div class="container py-5" style="max-width: 720px;">
    <h1 class="mb-4 fw-semibold">도서 정보 등록</h1>

    <form action="{% url 'books:create' %}" method="POST" onsubmit="return validateForm()">
      {% csrf_token %}

      <div class="mb-3">
        <label for="title" class="form-label fw-medium">도서명</label>
        <input type="text" id="title" name="title" class="form-control" value="{{ book.title }}" required>
      </div>

      <div class="mb-3">
        <label for="content" class="form-label fw-medium">줄거리</label>
        <textarea id="content" name="content" class="form-control" rows="6" style="resize: vertical;" required>{{ book.content }}</textarea>
      </div>

      <div class="mb-4">
        <label for="author" class="form-label fw-medium">저자</label>
        <input type="text" id="author" name="author" class="form-control" value="{{ book.author }}" required>
      </div>

      <div class="mb-4">
        <label for="rating" class="form-label fw-medium">평점</label>
        <input type="number" step='0.1' id='rating' name='rating' min='0' max='5' required>
      </div>

      <button type="submit" class="btn btn-info px-4 py-2">제출</button>
    </form>
  </div>

  

  <script>
    function validateForm() {
      const title = document.getElementById('title').value.trim();
      const story = document.getElementById('content').value.trim();
      const director = document.getElementById('author').value.trim();

      if (title.length < 1) {
        alert("제목을 한 글자 이상 입력해주세요.");
        return false;
      }

      if (content.length < 1) {
        alert("설명을 한 글자 이상 입력해주세요.");
        return false;
      }

      if (author.length < 1) {
        alert("저자 이름을 한 글자 이상 입력해주세요.");
        return false;
      }

      return true;
    }
  </script>
{% endblock content %}
