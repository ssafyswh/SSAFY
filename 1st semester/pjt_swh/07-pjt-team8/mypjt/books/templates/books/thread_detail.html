{% extends 'base.html' %}

{% block content %}
  <h1>{{ thread.title }}</h1>
  <br>
  <h2>{{ thread.content }}</h2>

 <div class="d-flex gap-2 ms-3 mb-3 mt-3">
    <a href="{% url 'books:thread_update' thread.id %}" class='my-0'>
        <button class="btn btn-secondary">수정</button>
    </a>

    <form action="{% url 'books:thread_delete' thread.id %}" method="POST" class='my-0'>
        {% csrf_token %}
        <button class="btn btn-danger">삭제</button>
    </form>
  </div>

  
{% endblock %}
